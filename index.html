<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212" id="nav-color">
    <title>ThingSpeak Smart Monitor</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        /* Βασικό Dark Theme */
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --subtext: #888;
            --border: #333;
            --chart-grid: #2a2a2a;
        }

        /* Light Theme */
        .light-theme {
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #333333;
            --subtext: #666;
            --border: #ddd;
            --chart-grid: #eee;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: 0.3s; }
        
        .toolbar { 
            background: var(--card); padding: 12px 15px; border-radius: 12px; 
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid var(--border);
        }
        
        select, .theme-btn { 
            background: var(--bg); color: var(--text); border: 1px solid var(--border); 
            padding: 8px; border-radius: 8px; font-size: 14px; cursor: pointer;
        }

        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        
        .card { 
            background: var(--card); border-radius: 15px; padding: 15px; 
            border-top: 5px solid #333; border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        h3 { margin: 0; font-size: 0.85em; color: var(--subtext); text-transform: uppercase; }
        .time-status { font-size: 0.75em; color: var(--subtext); }
        .value-display { font-size: 2.2em; font-weight: bold; margin: 10px 0; display: flex; align-items: baseline; }
        .chart-box { width: 100%; height: 160px; }
    </style>
</head>
<body id="body-tag">

    <div class="toolbar">
        <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">☀️</button>
        <select id="resultsRange" onchange="loadData()">
            <option value="20" selected>20 μετρήσεις</option>
            <option value="100">100 μετρήσεις</option>
        </select>
    </div>

    <div class="grid-container" id="dashboard"></div>

    <script>
        // --- ΡΥΘΜΙΣΕΙΣ ΧΡΗΣΤΗ ---
        const channelID = '1758807'; 
        const readAPIKey = '4BM86485YQL566TF';
        
        const fieldConfig = {
            'field1': { label: 'Βαρος', unit: '°C' },
            'field2': { label: 'Υγρασία', unit: '%' },
            'field3': { label: 'Θερμοκρασια', unit: 'hPa' },
            'field4': { label: 'Μπαταρια', unit: 'V' },
            'field5': { label: 'διαφορα βάρους', unit: 'lux' },
            'field6': { label: 'signal quality', unit: 'm' }
        };

        const colors = ['#ff5252', '#448aff', '#4caf50', '#ff9800', '#e040fb', '#00bcd4'];

        // --- ΕΝΑΛΛΑΓΗ ΘΕΜΑΤΟΣ ---
        function toggleTheme() {
            const body = document.getElementById('body-tag');
            const btn = document.getElementById('theme-icon');
            const metaTheme = document.getElementById('nav-color');
            
            body.classList.toggle('light-theme');
            
            if(body.classList.contains('light-theme')) {
                btn.innerText = '🌙';
                metaTheme.setAttribute('content', '#f4f7f6');
            } else {
                btn.innerText = '☀️';
                metaTheme.setAttribute('content', '#121212');
            }
            loadData(); // Επαναφόρτωση για να αλλάξουν τα χρώματα στα γραφήματα
        }

        // --- ΛΟΙΠΕΣ ΛΕΙΤΟΥΡΓΙΕΣ (ίδιες με πριν) ---
        function getIcon(name) {
            name = name.toLowerCase();
            if (name.includes('temp') || name.includes('θερμ')) return '🌡️';
            if (name.includes('hum') || name.includes('υγρα')) return '💧';
            return '📊';
        }

        function timeAgo(dateString) {
            const diffMins = Math.round((new Date() - new Date(dateString)) / 60000);
            return diffMins < 1 ? 'Τώρα' : `Πριν ${diffMins}λ`;
        }

        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(loadData);

        function loadData() {
            const results = document.getElementById('resultsRange').value;
            fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=${results}`)
            .then(res => res.json()).then(data => {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';
                const isLight = document.getElementById('body-tag').classList.contains('light-theme');
                const gridColor = isLight ? '#eee' : '#2a2a2a';
                const textCol = isLight ? '#999' : '#555';

                for (let i = 1; i <= 6; i++) {
                    const key = 'field' + i;
                    if (!data.channel[key]) continue;

                    const displayName = fieldConfig[key] ? fieldConfig[key].label : data.channel[key];
                    const unit = fieldConfig[key] ? fieldConfig[key].unit : '';
                    const lastValue = data.feeds[data.feeds.length - 1][key];
                    const color = colors[i-1];

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.borderTopColor = color;
                    card.innerHTML = `
                        <div class="header-flex">
                            <h3>${displayName}</h3>
                            <span class="time-status">${timeAgo(data.feeds[data.feeds.length-1].created_at)}</span>
                        </div>
                        <div class="value-display" style="color: ${color}">
                            ${parseFloat(lastValue).toFixed(1)}<span style="font-size:14px; opacity:0.6; margin-left:4px;">${unit}</span>
                            <span style="margin-left: auto;">${getIcon(displayName)}</span>
                        </div>
                        <div id="chart_${i}" class="chart-box"></div>
                    `;
                    dashboard.appendChild(card);
                    drawChart(data.feeds, i, displayName, color, gridColor, textCol);
                }
            });
        }

        function drawChart(feeds, fieldNum, label, color, gridCol, textCol) {
            const chartData = [['Time', label]];
            feeds.forEach(f => {
                const val = parseFloat(f['field' + fieldNum]);
                if(!isNaN(val)) chartData.push([new Date(f.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), val]);
            });

            const options = {
                backgroundColor: 'transparent',
                curveType: 'function',
                legend: { position: 'none' },
                chartArea: { width: '95%', height: '80%' },
                hAxis: { textPosition: 'none', baselineColor: 'none', gridlines: {color: 'none'} },
                vAxis: { gridlines: {color: gridCol}, textStyle: {color: textCol, fontSize: 10} },
                colors: [color],
                lineWidth: 3
            };
            new google.visualization.LineChart(document.getElementById('chart_' + fieldNum)).draw(google.visualization.arrayToDataTable(chartData), options);
        }

        setInterval(loadData, 60000);
    </script>
</body>
    </html>
