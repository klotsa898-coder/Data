<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beekeeping Pro - 24h Analysis</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --accent: #1a73e8; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        
        .yield-banner { 
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d); 
            padding: 20px; border-radius: 15px; margin-bottom: 20px; 
            text-align: center; border: 1px solid #333;
        }
        .yield-val { font-size: 2.5em; font-weight: bold; color: #4caf50; }
        
        .toolbar { background: var(--card); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        
        .card { background: var(--card); border-radius: 15px; padding: 15px; border-top: 5px solid var(--accent); }
        .value-display { font-size: 2.2em; font-weight: bold; }
        .stats-row { display: flex; gap: 10px; font-size: 0.75em; color: #888; }
        .chart-box, .gauge-box { width: 100%; height: 160px; }
        select { background: #333; color: white; border: none; padding: 8px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="yield-banner">
        <div style="font-size: 0.9em; color: #888;">ΔΙΑΦΟΡΑ 24Ω (21:00 - 21:00)</div>
        <div id="24hYield" class="yield-val">Υπολογισμός...</div>
        <div id="yieldDate" style="font-size: 0.7em; color: #555;">Αναμονή δεδομένων</div>
    </div>

    <div class="toolbar">
        <span style="font-size: 0.8em;">Προβολή:</span>
        <select id="resultsRange" onchange="loadData()">
            <option value="5">Τελευταίες 5</option>
            <option value="15" selected>Τελευταίες 15</option>
            <option value="30">Τελευταίες 30</option>
        </select>
    </div>

    <div id="dashboard" class="grid-container"></div>

    <script>
        const channelID = '1758807';
        const readAPIKey = '4BM86485YQL566TF';

        const fieldConfig = {
            'field1': { label: 'Βάρος', unit: 'kg', type: 'line', color: '#ff5252' },
            'field2': { label: 'Υγρασία', unit: '%', type: 'line', color: '#448aff' },
            'field3': { label: 'Θερμοκρασία', unit: '°C', type: 'line', color: '#4caf50' },
            'field4': { label: 'Μπαταρία', unit: 'V', type: 'gauge', min: 10, max: 14, red: 11.5, yellow: 12.2 },
            'field5': { label: 'Διαφορά', unit: 'kg', type: 'line', color: '#ff4081' },
            'field6': { label: 'GSM Signal', unit: 'dBm', type: 'gauge', min: -120, max: -40, red: -110, yellow: -90 }
        };

        google.charts.load('current', {'packages':['corechart', 'gauge']});
        google.charts.setOnLoadCallback(() => {
            loadData();
            calculate24hYield();
        });

        async function calculate24hYield() {
            try {
                // Φέρνουμε δεδομένα των τελευταίων 2 ημερών
                const res = await fetch(`https://api.thingspeak.com/channels/${channelID}/fields/1.json?api_key=${readAPIKey}&results=200`);
                const data = await res.json();
                const feeds = data.feeds;

                // Βρίσκουμε την πιο κοντινή μέτρηση στις 21:00 χθες και σήμερα
                const getWeightAt21 = (targetDate) => {
                    const target = new Date(targetDate);
                    target.setHours(21, 0, 0);
                    return feeds.reduce((prev, curr) => {
                        return Math.abs(new Date(curr.created_at) - target) < Math.abs(new Date(prev.created_at) - target) ? curr : prev;
                    });
                };

                const today = new Date();
                const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);

                const entryToday = getWeightAt21(today);
                const entryYesterday = getWeightAt21(yesterday);

                const diff = (parseFloat(entryToday.field1) - parseFloat(entryYesterday.field1)).toFixed(2);
                const color = diff >= 0 ? '#4caf50' : '#ff5252';
                
                document.getElementById('24hYield').innerHTML = `${diff > 0 ? '+' : ''}${diff} <span style="font-size:0.4em">kg</span>`;
                document.getElementById('24hYield').style.color = color;
                document.getElementById('yieldDate').innerText = `Σύγκριση: ${new Date(entryYesterday.created_at).toLocaleString()} με ${new Date(entryToday.created_at).toLocaleString()}`;
            } catch(e) {
                document.getElementById('24hYield').innerText = "--";
            }
        }

        function loadData() {
            const results = document.getElementById('resultsRange').value;
            fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=${results}`)
            .then(res => res.json()).then(data => {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                for (let i = 1; i <= 6; i++) {
                    const key = 'field' + i;
                    if (!data.channel[key]) continue;
                    const feeds = data.feeds.map(f => parseFloat(f[key])).filter(v => !isNaN(v));
                    const lastVal = feeds[feeds.length - 1];
                    const conf = fieldConfig[key];

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${conf.label}</h3>
                        <div class="value-display" style="color:${conf.color || '#fff'}">${lastVal.toFixed(2)}<span style="font-size:0.4em; color:#666;">${conf.unit}</span></div>
                        <div id="viz_${i}" class="${conf.type === 'gauge' ? 'gauge-box' : 'chart-box'}"></div>
                    `;
                    dashboard.appendChild(card);

                    if (conf.type === 'gauge') {
                        drawGauge(i, lastVal, conf);
                    } else {
                        drawChart(data.feeds, i, conf.label, conf.color);
                    }
                }
            });
        }

        function drawGauge(id, val, conf) {
            new google.visualization.Gauge(document.getElementById('viz_' + id)).draw(google.visualization.arrayToDataTable([['Label', 'Value'], ['', val]]), { min: conf.min, max: conf.max, redFrom: conf.min, redTo: conf.red, yellowFrom: conf.red, yellowTo: conf.yellow, greenFrom: conf.yellow, greenTo: conf.max, minorTicks: 5 });
        }

        function drawChart(feeds, i, label, color) {
            new google.visualization.LineChart(document.getElementById('viz_'+i)).draw(google.visualization.arrayToDataTable([['Time', label], ...feeds.map(f => [new Date(f.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), parseFloat(f['field'+i])])]), { backgroundColor: 'transparent', curveType: 'function', legend: 'none', hAxis: {textPosition: 'none'}, vAxis: {gridlines: {color:'#333'}}, colors: [color], chartArea: {width:'95%', height:'80%'} });
        }

        setInterval(() => { loadData(); calculate24hYield(); }, 60000);
    </script>
</body>
</html>
