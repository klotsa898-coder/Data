     <!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beekeeping Pro - Full Control</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --accent: #1a73e8; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .yield-banner { background: linear-gradient(135deg, #1e1e1e, #2d2d2d); padding: 15px; border-radius: 15px; margin-bottom: 5px; text-align: center; border: 1px solid var(--border); }
        .yield-val { font-size: 2.2em; font-weight: bold; }
        .yield-info { font-size: 0.65em; color: #666; margin-top: 5px; text-transform: uppercase; }
        .last-update { font-size: 0.75em; color: #ffca28; text-align: center; margin-bottom: 10px; background: #252525; padding: 8px; border-radius: 10px; border: 1px solid #444; }
        
        /* Επαναφορά Toolbar για επιλογή μετρήσεων */
        .toolbar { background: var(--card); padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .toolbar-label { font-size: 0.75em; color: #888; }
        select { background: #333; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 11px; cursor: pointer; outline: none; }

        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        .card { background: var(--card); border-radius: 15px; padding: 15px; border-top: 5px solid var(--accent); position: relative; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        h3 { margin: 0; font-size: 0.85em; color: #888; text-transform: uppercase; }
        .value-display { font-size: 2.2em; font-weight: bold; margin: 5px 0; display: flex; align-items: baseline; }
        .stats-row { display: flex; gap: 10px; font-size: 0.75em; color: #777; margin-bottom: 10px; border-top: 1px solid #2a2a2a; padding-top: 5px; }
        .chart-box { width: 100%; height: 140px; }
    </style>
</head>
<body>

    <div class="yield-banner">
        <div style="font-size: 0.75em; color: #888; margin-bottom: 5px;">ΔΙΑΦΟΡΑ 24Ω</div>
        <div id="24hYield" class="yield-val">--</div>
        <div class="yield-info">Σύγκριση 21:00 χθες - 21:00 σήμερα</div>
    </div>

    <div class="last-update" id="mainUpdate">🕒 Αναμονή...</div>

    <div class="toolbar">
        <span class="toolbar-label">Εύρος Γραφήματος:</span>
        <select id="resultsRange" onchange="loadData()">
            <option value="10">Τελευταίες 10</option>
            <option value="20" selected>Τελευταίες 20</option>
            <option value="50">Τελευταίες 50</option>
            <option value="100">Τελευταίες 100</option>
        </select>
    </div>

    <div id="dashboard" class="grid-container"></div>

    <script>
        const channelID = '1758807'; 
        const readAPIKey = '4BM86485YQL566TF';
        const fieldConfig = {
            'field1': { label: 'Βάρος', unit: 'gr', icon: '⚖️', color: '#ff5252', decimals: 0 },
            'field2': { label: 'Υγρασία', unit: '%', icon: '💧', color: '#448aff', decimals: 1 },
            'field3': { label: 'Θερμοκρασία', unit: '°C', icon: '🌡️', color: '#4caf50', decimals: 1 },
            'field4': { label: 'Μπαταρία', unit: 'V', icon: '🔋', color: '#ffc107', decimals: 2 },
            'field5': { label: 'Διαφορά', unit: 'gr', icon: '📉', color: '#ff4081', decimals: 0 },
            'field6': { label: 'GSM Signal', unit: 'dBm', icon: '📶', color: '#00bcd4', decimals: 0 }
        };

        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(() => { loadData(); calculate24hYield(); });

        async function calculate24hYield() {
            try {
                const res = await fetch(`https://api.thingspeak.com/channels/${channelID}/fields/1.json?api_key=${readAPIKey}&results=250`);
                const data = await res.json();
                const feeds = data.feeds;
                const getWeightAt21 = (targetDate) => {
                    const target = new Date(targetDate);
                    target.setHours(21, 0, 0);
                    return feeds.reduce((prev, curr) => 
                        Math.abs(new Date(curr.created_at) - target) < Math.abs(new Date(prev.created_at) - target) ? curr : prev
                    );
                };
                const valToday = parseFloat(getWeightAt21(new Date()).field1);
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                const valYesterday = parseFloat(getWeightAt21(yesterday).field1);
                
                const diffKg = ((valToday - valYesterday) / 1000).toFixed(2);
                const el = document.getElementById('24hYield');
                el.innerHTML = `${diffKg > 0 ? '+' : ''}${diffKg} <span style="font-size:0.4em">kg</span>`;
                el.style.color = diffKg >= 0 ? '#4caf50' : '#ff5252';
            } catch(e) { console.error(e); }
        }

        function loadData() {
            const numResults = document.getElementById('resultsRange').value;
            fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=${numResults}`)
            .then(res => res.json()).then(data => {
                if(!data.feeds || !data.feeds.length) return;
                const lastFeed = data.feeds[data.feeds.length - 1];
                
                const lastDate = new Date(lastFeed.created_at);
                document.getElementById('mainUpdate').innerText = `🕒 Τελευταία μέτρηση: ${lastDate.toLocaleDateString('el-GR')} | ${lastDate.toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit'})}`;

                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';
                
                Object.keys(fieldConfig).forEach(key => {
                    const conf = fieldConfig[key];
                    const feeds = data.feeds.map(f => parseFloat(f[key])).filter(v => !isNaN(v));
                    if(feeds.length === 0) return;

                    const lastVal = feeds[feeds.length - 1];
                    const maxVal = Math.max(...feeds);
                    const minVal = Math.min(...feeds);

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="header-flex"><h3>${conf.label}</h3><span>${conf.icon}</span></div>
                        <div class="value-display" style="color:${conf.color}">
                            ${lastVal.toFixed(conf.decimals)}<span style="font-size:0.4em; color:#666; margin-left:5px;">${conf.unit}</span>
                        </div>
                        <div class="stats-row">
                            <span>MIN: ${minVal.toFixed(conf.decimals)}</span>
                            <span>MAX: ${maxVal.toFixed(conf.decimals)}</span>
                        </div>
                        <div id="chart_${key}" class="chart-box"></div>
                    `;
                    dashboard.appendChild(card);
                    drawChart(data.feeds, key, conf.label, conf.color);
                });
            });
        }

        function drawChart(feeds, key, label, color) {
            const dataTable = new google.visualization.DataTable();
            dataTable.addColumn('string', 'Time');
            dataTable.addColumn('number', label);
            feeds.forEach(f => {
                let v = parseFloat(f[key]);
                if (!isNaN(v)) dataTable.addRow([new Date(f.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), v]);
            });
            new google.visualization.LineChart(document.getElementById('chart_'+key)).draw(dataTable, {
                backgroundColor: 'transparent', curveType: 'function', legend: 'none',
                hAxis: { textPosition: 'none' }, vAxis: { gridlines: {color:'#2a2a2a'}, textStyle: {color:'#555'} },
                colors: [color], chartArea: {width:'90%', height:'80%'}
            });
        }

        setInterval(() => { loadData(); calculate24hYield(); }, 60000);
    </script>
</body>
</html>
