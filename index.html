<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThingSpeak Advanced Monitor</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 10px; }
        
        /* Toolbar Styles */
        .toolbar { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        select { background: #333; color: white; border: 1px solid #444; padding: 8px; border-radius: 5px; font-size: 14px; }
        
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        
        .card { background: #1e1e1e; border-radius: 15px; padding: 15px; border-top: 4px solid #333; position: relative; }
        .chart-box { width: 100%; height: 160px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        h3 { margin: 0; font-size: 0.9em; color: #bbb; text-transform: uppercase; }
        
        .value-display { font-size: 2em; font-weight: bold; margin: 5px 0; }
        .icon-bg { font-size: 1.5em; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="toolbar">
        <span>Προβολή:</span>
        <select id="resultsRange" onchange="loadData()">
            <option value="10">Τελευταίες 10 μετρήσεις</option>
            <option value="50" selected>Τελευταίες 50 μετρήσεις</option>
            <option value="100">Τελευταίες 100 μετρήσεις</option>
            <option value="400">Τελευταίες 400 μετρήσεις</option>
        </select>
    </div>

    <div class="grid-container" id="dashboard"></div>

    <script>
        const channelID = '1758807';
        const readAPIKey = '4BM86485YQL566TF';
        const colors = ['#ff5252', '#448aff', '#4caf50', '#ff9800', '#e040fb', '#00bcd4'];

        function getIcon(name) {
            name = name.toLowerCase();
            if (name.includes('temp') || name.includes('θερμ')) return '🌡️';
            if (name.includes('hum') || name.includes('υγρα')) return '💧';
            if (name.includes('volt') || name.includes('batt') || name.includes('τάση')) return '🔋';
            if (name.includes('pres') || name.includes('πίεσ')) return '⏲️';
            if (name.includes('light') || name.includes('φως')) return '☀️';
            return '📊';
        }

        google.charts.load('current', {'packages':['corechart']});
        google.charts.setOnLoadCallback(loadData);

        function loadData() {
            const results = document.getElementById('resultsRange').value;
            const url = `https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=${results}`;
            
            fetch(url).then(res => res.json()).then(data => {
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                for (let i = 1; i <= 6; i++) {
                    const fieldName = data.channel['field' + i];
                    if (!fieldName) continue;

                    const lastValue = data.feeds[data.feeds.length - 1]['field' + i];
                    const color = colors[i-1];

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.borderTopColor = color;
                    card.innerHTML = `
                        <div class="header-flex">
                            <h3>${fieldName}</h3>
                            <span class="icon-bg">${getIcon(fieldName)}</span>
                        </div>
                        <div class="value-display" style="color: ${color}">
                            ${parseFloat(lastValue).toFixed(1)}
                        </div>
                        <div id="chart_${i}" class="chart-box"></div>
                    `;
                    dashboard.appendChild(card);
                    drawChart(data.feeds, i, fieldName, color);
                }
            });
        }

        function drawChart(feeds, fieldNum, label, color) {
            const chartData = [['Time', label]];
            feeds.forEach(f => {
                const val = parseFloat(f['field' + fieldNum]);
                if(!isNaN(val)) {
                    const time = new Date(f.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    chartData.push([time, val]);
                }
            });

            const dataTable = google.visualization.arrayToDataTable(chartData);
            const options = {
                backgroundColor: 'transparent',
                curveType: 'function',
                legend: { position: 'none' },
                chartArea: { width: '90%', height: '80%' },
                hAxis: { textPosition: 'none', baselineColor: 'none', gridlines: {color: 'none'} },
                vAxis: { gridlines: {color: '#333', count: 3}, textStyle: {color: '#666', fontSize: 10} },
                colors: [color],
                lineWidth: 2,
                pointsVisible: feeds.length <= 20 // Δείχνει τελείες μόνο αν είναι λίγα τα δεδομένα
            };

            const chart = new google.visualization.LineChart(document.getElementById('chart_' + fieldNum));
            chart.draw(dataTable, options);
        }

        // Αυτόματη ανανέωση κάθε 1 λεπτό για να μη "ζορίζεται" το API με πολλά δεδομένα
        setInterval(loadData, 60000);
    </script>
</body>
  </html>
